<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Dashboard</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #e3e6eb; --text: #1b1f24; --muted: #6b7280;
    --run: #2563eb; --ok: #15803d; --fail: #dc2626; --warn: #b45309; --idle: #9ca3af; --chip: #eef2f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a21; --line: #262b35; --text: #e6e8eb; --muted: #8b93a1;
      --run: #60a5fa; --ok: #4ade80; --fail: #f87171; --warn: #fbbf24; --idle: #4b5563; --chip: #1f2430;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 16px 24px;
    border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  h1 { font-size: 17px; margin: 0; }
  .stat { color: var(--muted); }
  .stat b { color: var(--text); font-variant-numeric: tabular-nums; }
  .conn { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); display: inline-block; }
  .dot.on { background: var(--ok); }
  select { background: var(--chip); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 6px; font: inherit; font-size: 12px; max-width: 260px; }
  .grid > div { display: contents; }
  .multi { font-size: 12px; color: var(--run); font-weight: 600; }
  button { background: var(--chip); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 12px; }
  main { padding: 20px 24px; display: grid; gap: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px;
    display: flex; flex-direction: column; gap: 8px; min-height: 150px; border-top: 3px solid var(--idle); }
  .card.running { border-top-color: var(--run); }
  .card.completed { border-top-color: var(--ok); }
  .card.failed { border-top-color: var(--fail); }
  .card.stopped, .card.stale { border-top-color: var(--warn); }
  .stopped .badge, .stale .badge { color: var(--warn); }
  .bar.stopped, .bar.stale { background: var(--warn); }
  .card .top { display: flex; align-items: center; gap: 8px; }
  .card .name { font-weight: 600; font-size: 15px; }
  .badge { margin-left: auto; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--chip); color: var(--muted); }
  .running .badge { color: var(--run); }
  .completed .badge { color: var(--ok); }
  .failed .badge { color: var(--fail); }
  .running .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--run); animation: p 1.2s infinite; }
  @keyframes p { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .running .pulse { animation: none; } }
  .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .tool { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: var(--chip);
    border-radius: 6px; padding: 6px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool .t { color: var(--run); font-weight: 600; }
  .trail { display: flex; flex-wrap: wrap; gap: 3px; }
  .trail span { font-size: 11px; padding: 0 5px; border-radius: 4px; background: var(--chip); color: var(--muted); }
  .trail span.f { color: var(--fail); }
  section h2 { font-size: 14px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }
  .timeline { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; }
  .lane { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 8px; height: 26px; }
  .lane .lbl { font-size: 12px; color: var(--muted); }
  .track { position: relative; height: 14px; background: var(--chip); border-radius: 4px; }
  .bar { position: absolute; top: 0; height: 14px; border-radius: 4px; background: var(--ok); opacity: .85; min-width: 3px; }
  .bar.running { background: var(--run); }
  .bar.failed { background: var(--fail); }
  .feed { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; max-height: 340px; overflow: auto; }
  .row { display: grid; grid-template-columns: 70px 100px 110px 1fr; gap: 10px; padding: 5px 14px;
    border-bottom: 1px solid var(--line); font-size: 12px; align-items: baseline; }
  .row:last-child { border-bottom: 0; }
  .row .time { color: var(--muted); font-variant-numeric: tabular-nums; }
  .row .ev { color: var(--muted); }
  .row .ev.start { color: var(--run); } .row .ev.stop { color: var(--ok); } .row .ev.fail { color: var(--fail); }
  .row .detail { font-family: ui-monospace, Consolas, monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { color: var(--muted); padding: 14px; font-size: 13px; }
  @media (max-width: 600px) {
    header, main { padding-left: 16px; padding-right: 16px; }
    .row { grid-template-columns: 60px 1fr; }
    .row .ag, .row .ev { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Agent Dashboard</h1>
  <span class="stat">실행 중 <b id="sRun">0</b></span>
  <span class="stat">완료 <b id="sDone">0</b></span>
  <span class="stat">도구 호출 <b id="sTools">0</b></span>
  <select id="session" aria-label="세션"><option value="">모든 세션</option></select>
  <span class="conn"><span class="dot" id="dot"></span><span id="connText">연결 중…</span>
    <button id="clear" title="기록을 모두 지웁니다">기록 지우기</button></span>
</header>
<main>
  <div class="grid" id="cards"></div>
  <section>
    <h2>타임라인 (최근 실행)</h2>
    <div class="timeline" id="timeline"></div>
  </section>
  <section>
    <h2>실시간 이벤트</h2>
    <div class="feed" id="feed"><div class="empty">아직 이벤트가 없습니다. 서브에이전트를 실행해 보세요.</div></div>
  </section>
</main>
<script>
let AGENTS = []        // from the server: ~/.claude/agents/*.md
const LABEL = { idle: '대기', running: '실행', completed: '완료', failed: '실패', stopped: '중단', stale: '응답 없음' }
const ENDED = new Set(['completed', 'stopped'])
const STALE_MS = 15 * 60 * 1000

let runs = new Map()   // agent_id -> run
let events = []
let sessions = new Map() // session -> { first, last, ended }

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const clock = ts => new Date(ts).toLocaleTimeString('ko-KR', { hour12: false })
const dur = ms => {
  const s = Math.max(0, Math.floor(ms / 1000)), m = Math.floor(s / 60)
  return m ? `${m}m ${String(s % 60).padStart(2, '0')}s` : `${s}s`
}

function runFor(e) {
  let r = runs.get(e.agent_id)
  if (!r) {
    r = { id: e.agent_id, type: e.agent_type || 'unknown', session: e.session, status: 'running',
          start: e.ts, end: null, lastSeen: e.ts, calls: new Map(), message: null }
    runs.set(e.agent_id, r)
  }
  if (e.agent_type && r.type === 'unknown') r.type = e.agent_type
  r.session ??= e.session
  // A main run's start is its current turn's, set by UserPromptSubmit
  if (r.type !== 'main') r.start = Math.min(r.start, e.ts)
  r.lastSeen = Math.max(r.lastSeen, e.ts)
  return r
}

// Async hooks may land out of order: a Post before its Pre, a Pre after the
// stop. Calls are paired by tool_use_id, and an ended run never runs again.
function callFor(r, e) {
  const key = e.tool_use_id || `${e.tool}-${e.ts}`
  let c = r.calls.get(key)
  if (!c) {
    c = { tool: e.tool, input: e.input, start: e.ts, end: null, failed: false }
    r.calls.set(key, c)
  }
  return c
}

function apply(e) {
  events.push(e)
  if (events.length > 500) events.shift()
  if (e.session) {
    const s = sessions.get(e.session) ?? { first: e.ts, last: e.ts, ended: false }
    s.first = Math.min(s.first, e.ts); s.last = Math.max(s.last, e.ts)
    s.ended ||= e.event === 'SessionEnd'
    sessions.set(e.session, s)
  }
  if (e.event === 'SessionEnd') {
    for (const r of runs.values()) {
      if (r.session === e.session && !ENDED.has(r.status)) { r.status = 'stopped'; r.end = e.ts }
    }
    return
  }
  if (!e.agent_id) return
  const r = runFor(e)
  switch (e.event) {
    case 'PreToolUse': {
      const c = callFor(r, e)
      c.tool = e.tool; c.input = e.input; c.start = Math.min(c.start, e.ts)
      break
    }
    case 'PostToolUse':
    case 'PostToolUseFailure': {
      const c = callFor(r, e)
      c.end = Math.max(c.end ?? 0, e.ts); c.failed ||= !!e.failed
      break
    }
    case 'SubagentStop':
      if (r.status !== 'completed') { r.status = 'completed'; r.end = e.ts }
      r.message = e.message
      break
    // The main conversation: each prompt opens a new turn on the same run
    case 'UserPromptSubmit':
      if (e.ts < (r.turnAt ?? 0)) break
      r.turnAt = e.ts; r.start = e.ts; r.end = null; r.status = 'running'
      r.calls = new Map(); r.message = null; r.prompt = e.prompt; r.turns = (r.turns ?? 0) + 1
      break
    case 'Stop':
      if (e.ts < (r.turnAt ?? 0)) break
      if (r.status === 'running') { r.status = 'completed'; r.end = e.ts }
      r.message = e.message
      break
  }
}

// What a run shows now: an unfinished run quiet for STALE_MS reads as stale.
function view(r, now) {
  const calls = [...r.calls.values()].sort((a, b) => a.start - b.start)
  const ended = ENDED.has(r.status)
  const open = ended ? null : calls.filter(c => c.end === null).pop() ?? null
  const status = !ended && now - r.lastSeen > STALE_MS ? 'stale' : r.status
  return { status, calls, open, end: ended ? r.end : status === 'stale' ? r.lastSeen : null }
}

// Writes an element only when its HTML changed since the last render.
const shown = new WeakMap()
function put(el, html) {
  if (shown.get(el) === html) return
  el.innerHTML = html
  shown.set(el, html)
}

// One keyed slot per card, so an unchanged card is never rewritten.
function putKeyed(container, entries) {
  const keys = entries.map(([k]) => k).join('\n')
  if (container.dataset.keys !== keys) {
    container.innerHTML = entries.map(() => '<div></div>').join('')
    container.dataset.keys = keys
  }
  entries.forEach(([, html], i) => put(container.children[i], html))
}

let selected = ''
try { selected = localStorage.getItem('dash.session') ?? '' } catch {}

function renderSessions() {
  const list = [...sessions.entries()].sort((a, b) => b[1].last - a[1].last)
  const options = ['<option value="">모든 세션</option>', ...list.map(([id, s]) =>
    `<option value="${esc(id)}">${esc(id.slice(0, 8))} · ${clock(s.first)}${s.ended ? ' · 종료' : ''}</option>`)]
  const el = document.getElementById('session')
  const html = options.join('')
  if (shown.get(el) !== html) {
    el.innerHTML = html
    shown.set(el, html)
  }
  if (selected && !sessions.has(selected)) selected = ''
  el.value = selected
}

function cardHtml(type, mine, now) {
  if (!mine.length) {
    return `<div class="card idle"><div class="top"><span class="name">${esc(type)}</span>
      <span class="badge">${LABEL.idle}</span></div><div class="meta">아직 실행 기록 없음</div></div>`
  }
  const running = mine.filter(x => x.v.status === 'running')
  // The card follows a running run when there is one, else the latest run
  const { r, v } = running[running.length - 1] ?? mine[mine.length - 1]
  const elapsed = dur((v.end ?? now) - r.start)
  const note = v.status === 'stale' ? ` · 마지막 이벤트 ${clock(r.lastSeen)}` : ''
  const toolLine = x => x.v.open
    ? `<div class="tool"><span class="t">▸ ${esc(x.v.open.tool)}</span> ${esc(x.v.open.input)}</div>`
    : `<div class="tool">${esc(x.r.message ?? '')}</div>`
  const isMain = type === 'main'
  const prompt = isMain && r.prompt
    ? `<div class="tool" title="${esc(r.prompt)}">💬 ${esc(r.prompt)}</div>` : ''
  const body = running.length > 1
    ? `<div class="multi">동시 실행 ${running.length}개</div>${running.slice(-4).map(toolLine).join('')}`
    : v.open || (r.message && !isMain) ? toolLine({ r, v }) : ''
  const label = isMain && v.status === 'completed' ? '응답 완료' : LABEL[v.status]
  const count = isMain ? `턴 ${r.turns ?? 0}번` : `실행 ${mine.length}번`
  const trail = `<div class="trail">${v.calls.slice(-14).map(c =>
    `<span class="${c.failed ? 'f' : ''}">${esc(c.tool)}</span>`).join('')}</div>`
  return `<div class="card ${v.status}">
    <div class="top">${v.status === 'running' ? '<span class="pulse"></span>' : ''}
      <span class="name">${isMain ? 'main · 메인 대화' : esc(type)}</span><span class="badge">${label}</span></div>
    <div class="meta">${elapsed} · 도구 ${v.calls.length}회 · ${count} · 시작 ${clock(r.start)}${note}</div>
    ${prompt}${body}${trail}</div>`
}

function render() {
  const now = Date.now()
  renderSessions()
  const all = [...runs.values()]
    .filter(r => !selected || r.session === selected)
    .map(r => ({ r, v: view(r, now) }))
    .sort((a, b) => a.r.start - b.r.start)
  const types = ['main', ...AGENTS,
    ...new Set(all.map(x => x.r.type).filter(t => t !== 'main' && !AGENTS.includes(t)))]

  document.getElementById('sRun').textContent = all.filter(x => x.v.status === 'running').length
  document.getElementById('sDone').textContent = all.filter(x => x.v.status === 'completed').length
  document.getElementById('sTools').textContent = all.reduce((n, x) => n + x.v.calls.length, 0)

  putKeyed(document.getElementById('cards'),
    types.map(type => [type, cardHtml(type, all.filter(x => x.r.type === type), now)]))

  const recent = all.slice(-12)
  const tl = document.getElementById('timeline')
  if (!recent.length) put(tl, '<div class="empty">실행 기록이 없습니다.</div>')
  else {
    const t0 = recent[0].r.start, t1 = Math.max(now, ...recent.map(x => x.v.end ?? now))
    const span = Math.max(1, t1 - t0)
    put(tl, recent.map(({ r, v }) => {
      const stop = v.end ?? now
      const left = (r.start - t0) / span * 100, width = (stop - r.start) / span * 100
      return `<div class="lane"><span class="lbl">${esc(r.type)}</span><div class="track">
        <div class="bar ${v.status}" style="left:${left.toFixed(2)}%;width:${width.toFixed(2)}%"
          title="${esc(r.type)} · ${LABEL[v.status]} · ${dur(stop - r.start)}"></div></div></div>`
    }).join(''))
  }

  const feed = document.getElementById('feed')
  const visible = events.filter(e => !selected || e.session === selected)
  if (!visible.length) {
    put(feed, '<div class="empty">아직 이벤트가 없습니다. 서브에이전트를 실행해 보세요.</div>')
    return
  }
  put(feed, visible.slice(-200).reverse().map(e => {
    const cls = e.event === 'SubagentStart' || e.event === 'UserPromptSubmit' ? 'start'
      : e.event === 'SubagentStop' || e.event === 'Stop' ? 'stop'
      : e.failed || e.event === 'SessionEnd' ? 'fail' : ''
    const detail = e.event === 'SubagentStop' || e.event === 'Stop' ? (e.message ?? '')
      : e.event === 'UserPromptSubmit' ? `💬 ${e.prompt ?? ''}`
      : e.event === 'SessionEnd' ? `세션 종료 (${e.reason ?? '알 수 없음'})`
      : [e.tool, e.input].filter(Boolean).join('  ')
    return `<div class="row"><span class="time">${clock(e.ts)}</span><span class="ev ${cls}">${esc(e.event)}</span>
      <span class="ag">${esc(e.agent_type || runs.get(e.agent_id)?.type || '')}</span>
      <span class="detail" title="${esc(detail)}">${esc(detail)}</span></div>`
  }).join(''))
}

let dirty = true
let lastId = ''
function connect() {
  const es = new EventSource('/events')
  const dot = document.getElementById('dot'), txt = document.getElementById('connText')
  es.onopen = () => { dot.classList.add('on'); txt.textContent = '연결됨' }
  es.onerror = () => { dot.classList.remove('on'); txt.textContent = '연결 끊김, 재시도 중…' }
  // The server resumes after Last-Event-ID on reconnect, or sends "reset" and
  // the whole buffer; lastId guards against applying an event twice anyway.
  es.onmessage = m => {
    if (m.lastEventId && m.lastEventId === lastId) return
    lastId = m.lastEventId
    try { apply(JSON.parse(m.data)); dirty = true } catch {}
  }
  es.addEventListener('reset', () => { clearState(); lastId = '' })
}
function clearState() {
  runs = new Map(); events = []; sessions = new Map(); dirty = true
}
document.getElementById('clear').onclick = async () => {
  if (!confirm('기록을 모두 지울까요?')) return
  await fetch('/clear', { method: 'POST', headers: { 'X-Dashboard': '1' } })
  clearState()
}
document.getElementById('session').onchange = e => {
  selected = e.target.value
  try { localStorage.setItem('dash.session', selected) } catch {}
  dirty = true
}
fetch('/agents').then(r => r.json()).then(list => { AGENTS = list; dirty = true }).catch(() => {})
setInterval(() => {
  if (dirty || [...runs.values()].some(r => r.status === 'running')) { render(); dirty = false }
}, 500)
connect()
render()
</script>
</body>
</html>
